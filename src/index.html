<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Locry</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Locry: uçtan uca şifreli notlar ve görevler, passkey ile. / End-to-end encrypted notes and tasks, unlocked with a passkey." />
    <!-- App pages have nothing to index; the prerendered landing pages switch this to index. -->
    <meta name="robots" content="noindex" />
    <!--
      Defense in depth on top of DOMPurify: scripts only from this app (and Google sign-in),
      network only to the services the user opts into (Google Drive, Hugging Face models).
      GoatCounter images count visits to the public pages, when the installation configures it.
      'wasm-unsafe-eval' is required by the in-browser AI runtime; ws: is the dev server's reload socket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://*.goatcounter.com;
        font-src 'self' data:;
        connect-src 'self' ws://localhost:* https://www.googleapis.com https://accounts.google.com https://huggingface.co https://*.huggingface.co https://*.hf.co;
        frame-src https://accounts.google.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self'"
    />
    <script src="theme-init.js"></script>
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Locry needs JavaScript. / Locry için JavaScript gerekli.</noscript>
  </body>
</html>
