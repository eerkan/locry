name: locry

services:
  locry:
    build: .
    image: locry:latest
    container_name: locry
    restart: unless-stopped
    ports:
      # Host side comes from .env (see .env.example); the container always listens on 4200.
      # Loopback by default: the app is for this machine. Changing the port changes the
      # browser origin, so data stored under another port is not visible here.
      - "${LOCRY_BIND_ADDRESS:-127.0.0.1}:${LOCRY_PORT:-4200}:4200"
    environment:
      # Built-in Google Client ID for Drive backups, from .env (see .env.example).
      LOCRY_GOOGLE_CLIENT_ID: ${LOCRY_GOOGLE_CLIENT_ID:-}
    # The container holds no user data (everything lives encrypted in the browser),
    # so it can run read-only and without privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional HTTPS for a public domain. Enabled with COMPOSE_PROFILES=https and
  # LOCRY_DOMAIN in .env; local use at http://localhost keeps working alongside it.
  caddy:
    image: caddy:2-alpine
    container_name: locry-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - locry
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LOCRY_DOMAIN: ${LOCRY_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  # Certificates and ACME account; keep them to avoid hitting issuance rate limits.
  caddy_data:
  caddy_config:
